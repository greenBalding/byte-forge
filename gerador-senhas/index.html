<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Gerador de Senhas</h1>
        <p>Crie senhas seguras em um clique!</p>
        
        <div class="password-display">
            <input type="text" id="password" readonly>
            <button onclick="copyPassword()">Copiar</button>
        </div>
        
        <div class="options">
            <div class="option">
                <label for="length">Tamanho:</label>
                <input type="number" id="length" min="8" max="32" value="12">
            </div>
            <div class="option">
                <label for="uppercase">Maiúsculas:</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <div class="option">
                <label for="numbers">Números:</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <div class="option">
                <label for="symbols">Símbolos:</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        
        <button onclick="generatePassword()" class="generate-btn">Gerar Senha</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
